name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Check generated documentation is current
        run: |
          python scripts/build_docs.py
          git diff --exit-code -- README.md examples/kaggle_anviroute.ipynb
      - run: anviroute --version
      - run: kagglelink --version
      - name: Verify Windows installer and command from another folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -InstallRoot "$env:RUNNER_TEMP/AnviRoute-Smoke" -SkipPathUpdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP/AnviRoute-Smoke/bin/anviroute.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
